# /etc/mastermind/config.toml   (root:mastermind 0640)
# bind: ONLY loopback / LAN (RFC1918) / Tailscale (100.64.0.0/10) addresses are accepted.
bind = "100.x.y.z"          # your Tailscale IP, or LAN IP
port = 8443
cert = "/etc/mastermind/tls/cert.pem"   # `mastermind admin init` creates a self-signed pair if missing
key  = "/etc/mastermind/tls/key.pem"
github_owner = "faisalfa123"
# github_token = "ghp_..."      # optional: raises the API rate limit; read-only scope is enough
# extra_repos = ["someone/else"]
# virustotal_key = "..."        # optional hash lookup (>=3 detections blocks)
min_free_mem_mb = 40            # below this, the lowest-priority app is stopped

