[package]
name = "mastermind"
version = "0.1.0"
edition = "2021"
description = "Ultra-light secure app manager for STB HG680P / Odroid C2 (DietPi)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
