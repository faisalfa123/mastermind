[package]
name = "mastermind"
version = "0.1.0"
edition = "2021"
description = "Ultra-light secure app manager for STB HG680P / Odroid C2 (DietPi)"
license = "MIT"

[dependencies]
argon2 = "0.5"
hex = "0.4.3"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6.1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
