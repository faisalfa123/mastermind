<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1c2c">
<meta name="referrer" content="no-referrer">
<title>Mastermind</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<header class="top">
  <div class="logo"><span class="sprite bot" aria-hidden="true"></span><h1>MASTERMIND</h1></div>
  <nav id="nav" hidden>
    <button data-tab="apps" class="on">APPS</button>
    <button data-tab="catalog">KATALOG</button>
    <button data-tab="blacklist">&#9760; BLACKLIST</button>
    <button data-tab="audit">AUDIT</button>
    <button id="logout" class="ghost">KELUAR</button>
  </nav>
</header>
<div id="offline" class="banner" hidden>OFFLINE &mdash; data terakhir (hanya baca)</div>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><form method="dialog" id="dlgform"><p id="dlgmsg"></p>
  <input id="dlgtotp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="KODE 2FA" hidden>
  <div class="row"><button value="cancel" class="ghost">BATAL</button><button value="ok" id="dlgok">LANJUT</button></div></form></dialog>
<script src="/app.js"></script>
</body>
</html>
