<!doctype html>
<html lang="id" data-theme="matcha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b241e">
<meta name="referrer" content="no-referrer">
<title>Mastermind — Zen App Manager</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="zen-canvas" aria-hidden="true"></canvas>
<header class="top">
  <div class="logo">
    <!-- Interactive Shell Bumiayu Mascot with Cursor Eye Tracking -->
    <div class="kodama-mascot" id="kodama-mascot" title="Shell Bumiayu (Cangkang Terminal & Gunung Slamet)">
      <div class="kodama-caping"></div>
      <div class="kodama-head">
        <div class="kodama-eye left"><span class="pupil"></span></div>
        <div class="kodama-eye right"><span class="pupil"></span></div>
        <div class="kodama-mouth"></div>
      </div>
      <div class="kodama-shell"><span class="shell-prompt">&gt;_</span></div>
    </div>
    <div class="brand">
      <h1>MASTERMIND</h1>
      <span class="sub-zen">BUMIAYU ZEN MANAGER</span>
    </div>
  </div>

  <div class="header-controls">
    <!-- Theme Switcher -->
    <div class="theme-select-wrapper">
      <span class="theme-icon">🍵</span>
      <select id="theme-select" aria-label="Ganti Tema Zen">
        <option value="matcha">Matcha Forest</option>
        <option value="sakura">Sakura Dusk</option>
        <option value="bamboo">Bamboo Mist</option>
        <option value="onsen">Onsen Slate</option>
        <option value="slamet">Slamet Dawn</option>
      </select>
    </div>

    <!-- Anim Mode Switcher -->
    <div class="theme-select-wrapper">
      <span class="theme-icon">🎨</span>
      <select id="anim-select" aria-label="Mode Animasi Latar">
        <option value="full">Anim: Penuh</option>
        <option value="eco">Anim: Hemat</option>
        <option value="off">Anim: Mati</option>
      </select>
    </div>

    <!-- FPS indicator badge -->
    <span class="fps-badge" id="fps-badge" title="Adaptive 12-24 FPS Rendering Engine">18 FPS</span>

    <nav id="nav" hidden>
      <button data-tab="apps" class="on">APPS</button>
      <button data-tab="catalog">KATALOG</button>
      <button data-tab="sites">SITUS</button>
      <button data-tab="creator">RACIK BATASAN</button>
      <button data-tab="blacklist">&#9760; BLACKLIST</button>
      <button data-tab="audit">AUDIT</button>
      <button id="logout" class="ghost">KELUAR</button>
    </nav>
  </div>
</header>

<div id="offline" class="banner" hidden>KONEKSI TERPUTUS &mdash; Menampilkan data cache terakhir (hanya baca)</div>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Modal dialog konfirmasi / 2FA -->
<dialog id="dlg">
  <form method="dialog" id="dlgform">
    <p id="dlgmsg"></p>
    <input id="dlgtotp" autocomplete="off" placeholder="JAWABAN RAHASIA" hidden>
    <div class="row">
      <button value="cancel" class="ghost">BATAL</button>
      <button value="ok" id="dlgok" class="good">LANJUT</button>
    </div>
  </form>
</dialog>

<script src="/scene.js"></script>
<script src="/app.js"></script>
</body>
</html>
