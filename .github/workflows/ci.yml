name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy -- -D warnings
      - run: cargo test
  release-arm64:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-unknown-linux-musl }
      - run: pip install cargo-zigbuild && pip install ziglang
      - run: cargo zigbuild --release --target aarch64-unknown-linux-musl
      - run: cp target/aarch64-unknown-linux-musl/release/mastermind mastermind-linux-arm64 && sha256sum mastermind-linux-arm64 > checksums.txt
      - uses: actions/upload-artifact@v4
        with: { name: mastermind-arm64, path: "mastermind-linux-arm64\nchecksums.txt" }
