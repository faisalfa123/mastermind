name: ci
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
permissions: { contents: write }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  build-arm64:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-unknown-linux-musl }
      - run: pip install cargo-zigbuild ziglang
      - run: cargo zigbuild --release --target aarch64-unknown-linux-musl
      - name: package
        run: |
          cp target/aarch64-unknown-linux-musl/release/mastermind mastermind-linux-arm64
          tar czf mastermind-deploy.tar.gz deploy examples
          sha256sum mastermind-linux-arm64 mastermind-deploy.tar.gz > checksums.txt
          file mastermind-linux-arm64; ls -l mastermind-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mastermind-arm64
          path: |
            mastermind-linux-arm64
            mastermind-deploy.tar.gz
            checksums.txt
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mastermind-linux-arm64
            mastermind-deploy.tar.gz
            checksums.txt
